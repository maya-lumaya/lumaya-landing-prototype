<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trainings — Lumaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }

:root {
  --bg: #FCF9F4;
  --bg-2: #F6F3EE;
  --bg-3: #EBE8E3;
  --surface: #FFFFFF;
  --text: #1C1C19;
  --text-muted: #5C5C5C;
  --text-subtle: #8A8A8A;
  --border: #C2C8C3;
  --primary: #182c24;
  --outline-variant: rgba(194, 200, 195, 0.35);
  --orange-300: #E4BB86;
  --orange-500: #D69543;
  --orange-600: #C4812B;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(29,29,33,0.04), 0 2px 6px rgba(29,29,33,0.04);
  --shadow-md: 0 4px 14px rgba(29,29,33,0.06), 0 10px 30px rgba(29,29,33,0.05);
  --ease: cubic-bezier(.2,.7,.2,1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; line-height: 1.55;
}
h1, h2, h3, h4 {
  font-family: 'Lora', Georgia, serif;
  font-weight: 500; letter-spacing: -0.012em; margin: 0;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { display: block; }

.container { width: 100%; max-width: 1480px; margin: 0 auto; padding: 0 28px; }
@media (max-width: 640px) { .container { padding: 0 16px; } }

/* ── Page wrap ─────────────────────────────────── */
.page { padding: 28px 0 0; }

/* ── Title row ─────────────────────────────────── */
.title-row { margin-bottom: 22px; }
.eyebrow {
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--orange-600); margin-bottom: 12px;
  display: inline-flex; align-items: center; gap: 8px;
}
.eyebrow::before { content: ''; width: 24px; height: 1px; background: var(--orange-300); }
h1.page-title {
  font-size: clamp(28px, 4vw, 42px);
  line-height: 1.08; font-weight: 500;
  color: var(--text); margin-bottom: 8px;
}
.title-sub { font-size: 14px; color: var(--text-muted); max-width: 600px; }

/* ── Filter bar ────────────────────────────────── */
.filterbar {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 10px; padding: 14px 0 18px;
  border-bottom: 1px solid var(--outline-variant);
  margin-bottom: 18px;
}
.filterbar-search {
  flex: 1 1 260px; min-width: 220px;
  display: flex; align-items: center; gap: 8px;
  background: var(--surface);
  border: 1px solid rgba(194, 200, 195, 0.4);
  border-radius: var(--radius-pill);
  height: 40px; padding: 0 14px 0 16px;
  transition: box-shadow 0.15s, border-color 0.15s;
}
.filterbar-search:focus-within {
  border-color: var(--orange-300);
  box-shadow: 0 0 0 3px rgba(228, 187, 134, 0.18);
}
.filterbar-search .material-symbols-outlined { font-size: 17px; color: var(--text-muted); }
.filterbar-search input {
  flex: 1; border: 0; background: transparent;
  outline: 0; font: 500 14px/1 'Inter', sans-serif;
  color: var(--text); min-width: 0;
}
.filterbar-search input::placeholder { color: var(--text-subtle); font-weight: 400; }
.filterbar-search .clear-btn {
  width: 22px; height: 22px; border-radius: 50%;
  background: var(--bg-3); color: var(--text-muted);
  display: none; align-items: center; justify-content: center;
}
.filterbar-search .clear-btn .material-symbols-outlined { font-size: 14px; }
.filterbar-search.has-text .clear-btn { display: flex; }

.fb-pill {
  display: inline-flex; align-items: center; gap: 6px;
  height: 40px; padding: 0 16px;
  border: 1px solid rgba(194, 200, 195, 0.4);
  border-radius: var(--radius-pill);
  font: 500 13px/1 'Inter', sans-serif;
  color: var(--text); background: var(--surface);
  transition: background 0.15s, border-color 0.15s;
  white-space: nowrap;
}
.fb-pill:hover { background: var(--bg-2); border-color: rgba(194,200,195,0.7); }
.fb-pill .material-symbols-outlined { font-size: 16px; color: var(--text-muted); }
.fb-pill .pill-clear {
  margin-left: 4px; color: var(--text-subtle);
  font-size: 16px; line-height: 1;
}
.fb-pill .pill-clear:hover { color: var(--text); }
.fb-pill.is-active {
  background: var(--primary); color: #fff;
  border-color: var(--primary);
}
.fb-pill.is-active .material-symbols-outlined,
.fb-pill.is-active .pill-clear { color: rgba(255,255,255,0.75); }

.fb-spacer { flex: 1; }

/* ── Category chip row ─────────────────────────── */
.chip-row {
  display: flex; gap: 8px; overflow-x: auto;
  padding-bottom: 14px; margin-bottom: 14px;
  scrollbar-width: none;
}
.chip-row::-webkit-scrollbar { display: none; }
.chip {
  flex-shrink: 0;
  display: inline-flex; align-items: center; gap: 6px;
  height: 32px; padding: 0 14px;
  border: 1px solid rgba(194, 200, 195, 0.4);
  border-radius: var(--radius-pill);
  font: 500 12px/1 'Inter', sans-serif;
  color: var(--text-muted); background: var(--surface);
  transition: all 0.15s;
}
.chip:hover { background: var(--bg-2); color: var(--text); }
.chip.is-active {
  background: var(--primary); color: #fff;
  border-color: var(--primary);
}
.chip .chip-count {
  font: 500 11px/1 'Inter', sans-serif;
  color: var(--text-subtle); margin-left: 2px;
}
.chip.is-active .chip-count { color: rgba(255,255,255,0.6); }

/* ── Result meta ───────────────────────────────── */
.result-meta {
  display: flex; align-items: center; justify-content: space-between;
  gap: 12px; margin-bottom: 16px; flex-wrap: wrap;
}
.result-meta .count {
  font: 600 14px/1 'Inter', sans-serif;
  color: var(--text);
}
.result-meta .count .muted { color: var(--text-muted); font-weight: 400; }
.sort-select {
  display: inline-flex; align-items: center; gap: 6px;
  font: 500 13px/1 'Inter', sans-serif; color: var(--text-muted);
}
.sort-select select {
  border: 0; background: transparent;
  font: 500 13px/1 'Inter', sans-serif; color: var(--text);
  cursor: pointer; outline: 0;
}

/* ── Layout ─────────────────────────────────────── */
/* Default: results full-width (no detail). Click a card → split opens. */
.split {
  display: grid;
  grid-template-columns: 1fr;
  gap: 28px;
  padding-bottom: 80px;
}
.split.detail-open {
  grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr);
}
.results-pane { min-width: 0; }

/* ── Detail pane — hidden until a card is clicked ─ */
.detail-pane {
  display: none;
  position: sticky; top: 90px;
  align-self: start;
  height: calc(100vh - 110px);
  border-radius: var(--radius-lg);
  overflow: hidden;
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  box-shadow: var(--shadow-md);
  flex-direction: column;
}
.split.detail-open .detail-pane { display: flex; }

.dp-img { position: relative; flex-shrink: 0; height: 240px; background: var(--bg-3); }
.dp-img img { width: 100%; height: 100%; object-fit: cover; }
.dp-img-overlay {
  position: absolute; inset: 0;
  background: linear-gradient(to top, rgba(28,28,25,0.5) 0%, rgba(28,28,25,0) 50%);
}
.dp-badge {
  position: absolute; top: 14px; left: 14px;
  background: rgba(252,249,244,0.95); backdrop-filter: blur(8px);
  padding: 5px 12px; border-radius: var(--radius-pill);
  font: 600 10px/1.4 'Inter', sans-serif;
  letter-spacing: 0.05em; color: var(--primary);
  text-transform: capitalize;
}
.dp-close {
  position: absolute; top: 14px; right: 14px;
  width: 36px; height: 36px; border-radius: 50%;
  background: rgba(252,249,244,0.95); backdrop-filter: blur(8px);
  display: flex; align-items: center; justify-content: center;
  color: var(--text); box-shadow: var(--shadow-sm);
  transition: background 0.15s;
  z-index: 2; cursor: pointer; border: 0;
}
.dp-close:hover { background: #fff; }
.dp-close .material-symbols-outlined { font-size: 20px; }
.dp-body { flex: 1; overflow-y: auto; padding: 22px 24px 0; }
.dp-title {
  font: 500 22px/1.2 'Lora', Georgia, serif;
  color: var(--text); margin-bottom: 10px;
  letter-spacing: -0.01em;
}
.dp-meta {
  display: flex; flex-wrap: wrap; gap: 6px 16px;
  font-size: 13px; color: var(--text-muted); margin-bottom: 18px;
}
.dp-meta .meta-item { display: inline-flex; align-items: center; gap: 5px; }
.dp-meta .material-symbols-outlined { font-size: 15px; color: var(--text-subtle); }
.dp-section {
  padding: 16px 0; border-top: 1px solid var(--outline-variant);
}
.dp-section:first-of-type { border-top: 0; padding-top: 0; }
.dp-section-label {
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: 0.08em; text-transform: uppercase;
  color: var(--text-subtle); margin-bottom: 10px;
}
.dp-description {
  font-size: 14px; line-height: 1.65;
  color: var(--text); margin: 0;
  white-space: pre-wrap;
}
.dp-stats {
  display: grid; grid-template-columns: 1fr 1fr; gap: 14px 18px;
}
.dp-stat .label {
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: 0.04em; color: var(--text-subtle);
  text-transform: uppercase; margin-bottom: 5px;
}
.dp-stat .value { font-size: 14px; color: var(--text); font-weight: 500; }
.dp-foot {
  flex-shrink: 0;
  border-top: 1px solid var(--outline-variant);
  padding: 16px 24px;
  background: var(--surface);
  display: flex; align-items: center; gap: 12px;
}
.dp-foot .price {
  flex: 1; font: 700 18px/1 'Inter', sans-serif;
  color: var(--text);
}
.dp-foot .price .per {
  font: 500 12px/1 'Inter', sans-serif;
  color: var(--text-muted); margin-left: 4px;
}
.dp-foot .view-btn {
  display: inline-flex; align-items: center; gap: 8px;
  height: 44px; padding: 0 22px;
  background: var(--primary); color: #fff;
  border-radius: var(--radius-pill);
  font: 600 13px/1 'Inter', sans-serif;
  transition: opacity 0.15s, transform 0.15s;
}
.dp-foot .view-btn:hover { opacity: 0.92; transform: translateY(-1px); }
.dp-foot .view-btn .material-symbols-outlined { font-size: 17px; }

/* Selected card — orange ring (matches events) */
.row-card.is-selected {
  border-color: var(--orange-300);
  box-shadow: 0 0 0 2px rgba(228,187,134,0.35), var(--shadow-md);
}

/* ── Result list — events-style 2-col, narrows when detail opens ── */
.results-list {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 16px;
}

/* ── Card (matches events-search-results.html .row-card exactly) ── */
.row-card {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: var(--radius-md);
  overflow: hidden;
  cursor: pointer;
  transition: transform 0.2s var(--ease), box-shadow 0.2s, border-color 0.15s;
  display: flex; flex-direction: column;
  text-align: left;
}
.row-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: rgba(194,200,195,0.7);
}
.row-card .rc-img {
  position: relative;
  aspect-ratio: 3/4;
  overflow: hidden;
  background: var(--bg-3);
  flex-shrink: 0;
}
.row-card .rc-img img {
  width: 100%; height: 100%; object-fit: cover;
  transition: transform 0.5s var(--ease);
}
.row-card:hover .rc-img img { transform: scale(1.04); }
.row-card .rc-badge {
  position: absolute; top: 10px; left: 10px;
  background: rgba(252,249,244,0.92);
  backdrop-filter: blur(6px);
  padding: 4px 10px; border-radius: var(--radius-pill);
  font: 600 10px/1.4 'Inter', sans-serif;
  letter-spacing: 0.05em; color: var(--primary);
  text-transform: capitalize; white-space: nowrap;
}
.row-card .rc-content {
  padding: 10px 12px 14px;
  display: flex; flex-direction: column;
  flex: 1;
}
.row-card .rc-title {
  font: 500 14px/1.3 'Inter', sans-serif;
  color: var(--text); margin-bottom: 4px;
  display: -webkit-box; -webkit-line-clamp: 2;
  -webkit-box-orient: vertical; overflow: hidden;
}
.row-card .rc-address {
  font-size: 12px; color: var(--text-muted);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  margin-bottom: auto; padding-bottom: 8px;
}
.row-card .rc-price {
  font: 700 14px/1 'Inter', sans-serif; color: var(--text);
  padding-top: 8px;
}
.split.detail-open .results-list {
  grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
}

/* ── Skeleton ──────────────────────────────────── */
.skeleton {
  background: linear-gradient(90deg, #EBE8E3 25%, #F0EDE8 50%, #EBE8E3 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-card {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: var(--radius-md);
  overflow: hidden;
}
.skel-card .skel-img { aspect-ratio: 3/4; border-radius: 0; }
.skel-card .skel-body { padding: 10px 12px 14px; display: flex; flex-direction: column; gap: 8px; }
.skel-card .skel-line { height: 13px; border-radius: 4px; }
.skel-card .skel-line.w80 { width: 80%; }
.skel-card .skel-line.w55 { width: 55%; }
.skel-card .skel-line.w40 { width: 40%; }

/* ── Empty / state block ──────────────────────── */
.state-block {
  text-align: center; padding: 64px 24px;
  background: var(--surface);
  border: 1px dashed var(--border);
  border-radius: var(--radius-lg);
  color: var(--text-muted);
  grid-column: 1 / -1;
}
.state-block .material-symbols-outlined {
  font-size: 42px; color: var(--text-subtle); margin-bottom: 14px;
}
.state-block h3 { font-size: 22px; color: var(--text); margin-bottom: 8px; }
.state-block p { font-size: 14px; max-width: 360px; margin: 0 auto; }
.state-block .reset-btn {
  display: inline-flex; align-items: center; gap: 6px;
  margin-top: 18px; padding: 10px 18px;
  background: var(--primary); color: #fff;
  border-radius: var(--radius-pill);
  font: 600 13px/1 'Inter', sans-serif;
}

/* ── Sheet backdrop ────────────────────────────── */
.sheet-backdrop {
  position: fixed; inset: 0;
  background: rgba(28,28,25,0.45);
  z-index: 100;
  opacity: 0; pointer-events: none;
  transition: opacity 0.25s var(--ease);
}
.sheet-backdrop.is-open { opacity: 1; pointer-events: auto; }

/* ── Grabber ────────────────────────────────────── */
.dp-grabber {
  display: none;
  position: absolute;
  top: 9px; left: 50%;
  transform: translateX(-50%);
  width: 36px; height: 4px;
  background: rgba(252,249,244,0.7);
  border-radius: 999px;
  z-index: 10;
}

/* ── Responsive ────────────────────────────────── */
@media (max-width: 1080px) {
  .split.detail-open { grid-template-columns: 1fr; }
  /* Bottom sheet — always present, off-screen until sheet-open */
  .detail-pane {
    display: flex;
    position: fixed;
    inset: auto 0 0 0; top: auto;
    height: 88vh; min-height: 0;
    border: 0;
    border-radius: var(--radius-lg) var(--radius-lg) 0 0;
    box-shadow: 0 -8px 40px rgba(28,28,25,0.18);
    transform: translateY(100%);
    transition: transform 0.32s var(--ease);
    z-index: 101;
  }
  .detail-pane.sheet-open { transform: translateY(0); }
  .dp-grabber { display: block; }
}
@media (max-width: 720px) {
  .results-list { grid-template-columns: repeat(2, 1fr); gap: 12px; }
  h1.page-title { font-size: 26px; }
  .filterbar-search { flex-basis: 100%; order: -1; }
}
@media (max-width: 420px) {
  .results-list { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- ── Header (shared partial — see header.js) ── -->
<div data-component="header" data-mode="hero" data-active="trainings" data-context="search"></div>

<!-- ── Mobile pillar tabs (shared partial — see mobile-tabs.js) ── -->
<div data-component="mobile-tabs" data-bar="true" data-active="trainings"></div>

<!-- ── Page ── -->
<div class="page">
  <div class="container">

    <!-- Title row -->
    <div class="title-row">
      <p class="eyebrow" id="ev-eyebrow">Browse</p>
      <h1 class="page-title" id="ev-page-title">Trainings</h1>
      <p class="title-sub" id="ev-page-sub">Teacher trainings, certifications, and deep professional immersions. Pick a discipline first, certification hours next.</p>
    </div>

    <!-- Filter bar — pillar-specific order: discipline → hours → where → starts -->
    <div class="filterbar" id="filterbar">
      <label class="filterbar-search" id="searchWrap">
        <span class="material-symbols-outlined">search</span>
        <input id="searchInput" type="search" placeholder="Search trainings by title, school, or discipline…" autocomplete="off">
        <button class="clear-btn" id="searchClear" type="button" aria-label="Clear search">
          <span class="material-symbols-outlined">close</span>
        </button>
      </label>

      <button class="fb-pill" id="disciplinePill" type="button">
        <span class="material-symbols-outlined">school</span>
        <span class="label">Any discipline</span>
        <span class="pill-clear material-symbols-outlined" data-clear="discipline" hidden>close</span>
      </button>

      <button class="fb-pill" id="hoursPill" type="button">
        <span class="material-symbols-outlined">workspace_premium</span>
        <span class="label">Any hours</span>
        <span class="pill-clear material-symbols-outlined" data-clear="hours" hidden>close</span>
      </button>

      <button class="fb-pill" id="wherePill" type="button">
        <span class="material-symbols-outlined">place</span>
        <span class="label">Anywhere</span>
        <span class="pill-clear material-symbols-outlined" data-clear="where" hidden>close</span>
      </button>

      <button class="fb-pill" id="startsPill" type="button">
        <span class="material-symbols-outlined">calendar_month</span>
        <span class="label">Any time</span>
        <span class="pill-clear material-symbols-outlined" data-clear="starts" hidden>close</span>
      </button>

      <button class="fb-pill" id="formatPill" type="button">
        <span class="material-symbols-outlined">tune</span>
        <span class="label">Any format</span>
        <span class="pill-clear material-symbols-outlined" data-clear="format" hidden>close</span>
      </button>

      <span class="fb-spacer"></span>
    </div>

    <!-- Cert-level chips -->
    <div class="chip-row" id="chipRow"></div>

    <!-- Result meta -->
    <div class="result-meta">
      <div class="count" id="resultCount"><span class="muted">Loading…</span></div>
      <label class="sort-select">
        <span>Sort:</span>
        <select id="sortSelect">
          <option value="DATE_ASC">Soonest start</option>
          <option value="HOURS_DESC">Hours: high → low</option>
          <option value="HOURS_ASC">Hours: low → high</option>
          <option value="PRICE_ASC">Price low → high</option>
          <option value="POPULAR">Most popular</option>
        </select>
      </label>
    </div>

    <!-- Split layout: results-only by default; click a card to open the detail pane -->
    <div class="split" id="split">
      <div class="results-pane">
        <div class="results-list" id="resultsList">
          <!-- skeletons -->
          <div class="skel-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div></div>
          <div class="skel-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div></div>
          <div class="skel-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div></div>
          <div class="skel-card"><div class="skeleton skel-img"></div><div class="skel-body"><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div></div>
        </div>
      </div>

      <aside class="detail-pane" id="detailPane" aria-label="Training details" aria-hidden="true"></aside>
    </div>

  </div>
</div>

<div class="sheet-backdrop" id="sheetBackdrop"></div>

<!-- ── Footer + Mobile bottom nav (shared partials) ── -->
<div data-component="footer"></div>
<div data-component="bottom-nav" data-active="search"></div>
<script src="header.js" defer></script>
<script src="footer.js" defer></script>
<script src="bottom-nav.js" defer></script>
<script src="scroll-animations.js" defer></script>
<script src="mobile-tabs.js" defer></script>

<script>
  /* ── Mock training dataset ─────────────────────────────
     Self-contained: no /api/v3/trainings/search endpoint exists yet.
     Cert hours (200/300/500) is the hero axis for the trainings buyer (per
     bookretreats.com analysis + Lumaya search-bar.md spec).
   */
  const TRAININGS = [
    { slug: 'rishikesh-200-ytt-feb', title: '200hr Multi-Style Yoga Teacher Training', school: 'Mahi Yoga School', accred: 'Yoga Alliance', discipline: 'yoga', hours: 200, country: 'IN', countryName: 'India', location: 'Rishikesh', startDate: '2026-09-04', durationDays: 28, format: 'intensive', online: false, priceFrom: 1480, popularity: 95, image: 'https://img.freepik.com/premium-photo/yoga-class-teacher-help-with-stretching-health-wellness-flexibility-studio-relax-students-instructor-with-seminar-workshop-calm-balance-gym-mat-with-people_590464-483229.jpg' },
    { slug: 'bali-300-ytt', title: '300hr Advanced Yoga Teacher Training', school: 'Radiantly Alive', accred: 'Yoga Alliance', discipline: 'yoga', hours: 300, country: 'ID', countryName: 'Indonesia', location: 'Ubud, Bali', startDate: '2026-10-15', durationDays: 28, format: 'intensive', online: false, priceFrom: 3200, popularity: 88, image: 'https://img.freepik.com/free-photo/beautiful-woman-doing-yoga-bali_72229-1514.jpg' },
    { slug: 'berlin-200-modular', title: '200hr Modular Vinyasa YTT (weekends)', school: 'Berlin Yoga Conference Studio', accred: 'BDY', discipline: 'yoga', hours: 200, country: 'DE', countryName: 'Germany', location: 'Berlin', startDate: '2026-09-19', durationDays: 280, format: 'modular', online: false, priceFrom: 2890, popularity: 76, image: 'https://img.freepik.com/free-photo/yoga-studio-berlin_1417-1453.jpg' },
    { slug: 'online-mbsr-cert', title: 'MBSR Mindfulness Teacher Certification', school: 'Mindfulness Center Online', accred: 'IMTA', discipline: 'meditation', hours: 100, country: '__', countryName: 'Online', location: 'Online (Zoom)', startDate: '2026-06-10', durationDays: 56, format: 'online', online: true, priceFrom: 1840, popularity: 71, image: 'https://img.freepik.com/free-photo/online-mindfulness-meditation_1417-1490.jpg' },
    { slug: 'somatic-experiencing-eu', title: 'Somatic Experiencing Beginner Year', school: 'SE Institute Europe', accred: 'SEI', discipline: 'healing', hours: 300, country: 'AT', countryName: 'Austria', location: 'Vienna', startDate: '2026-11-07', durationDays: 365, format: 'modular', online: false, priceFrom: 4200, popularity: 82, image: 'https://img.freepik.com/free-photo/therapy-session_1417-1488.jpg' },
    { slug: 'thailand-thai-massage', title: 'Traditional Thai Massage Certification', school: 'Sunshine Network', accred: 'Thai Ministry', discipline: 'bodywork', hours: 150, country: 'TH', countryName: 'Thailand', location: 'Chiang Mai', startDate: '2026-11-01', durationDays: 21, format: 'intensive', online: false, priceFrom: 1620, popularity: 79, image: 'https://img.freepik.com/free-photo/thai-massage_1417-1485.jpg' },
    { slug: 'breathwork-facilitator-pt', title: 'Breathwork Facilitator Training', school: 'Pause Breath School', accred: 'GPBA', discipline: 'ceremony', hours: 200, country: 'PT', countryName: 'Portugal', location: 'Lisbon + Algarve', startDate: '2026-10-10', durationDays: 84, format: 'modular', online: false, priceFrom: 3450, popularity: 74, image: 'https://img.freepik.com/free-photo/breathwork-session_1417-1480.jpg' },
    { slug: 'sound-healing-uk', title: 'Sound Healing Practitioner Certification', school: 'College of Sound Healing', accred: 'CSH', discipline: 'ceremony', hours: 100, country: 'GB', countryName: 'United Kingdom', location: 'Devon', startDate: '2026-09-12', durationDays: 14, format: 'intensive', online: false, priceFrom: 1980, popularity: 65, image: 'https://img.freepik.com/free-photo/sound-bowls_1417-1495.jpg' },
    { slug: 'icf-coach-cert', title: 'ICF-Accredited Coach Certification', school: 'Co-Active Training Institute', accred: 'ICF', discipline: 'coaching', hours: 200, country: '__', countryName: 'Online', location: 'Online (live cohort)', startDate: '2026-05-20', durationDays: 168, format: 'online', online: true, priceFrom: 6800, popularity: 87, image: 'https://img.freepik.com/free-photo/coaching-session-laptop_1417-1430.jpg' },
    { slug: 'kerala-ayurveda-pract', title: 'Ayurveda Practitioner Training', school: 'Kerala Ayurveda Academy', accred: 'NAMA', discipline: 'bodywork', hours: 500, country: 'IN', countryName: 'India', location: 'Kochi, Kerala', startDate: '2026-08-15', durationDays: 365, format: 'modular', online: false, priceFrom: 5400, popularity: 68, image: 'https://img.freepik.com/free-photo/ayurveda-treatment_23-2148945817.jpg' },
    { slug: 'kundalini-ytt-bali', title: '200hr Kundalini Yoga Teacher Training', school: 'Akasha Bali', accred: 'KRI', discipline: 'yoga', hours: 200, country: 'ID', countryName: 'Indonesia', location: 'Canggu, Bali', startDate: '2026-09-25', durationDays: 24, format: 'intensive', online: false, priceFrom: 2780, popularity: 70, image: 'https://img.freepik.com/free-photo/kundalini-yoga_1417-1465.jpg' },
    { slug: 'yin-ytt-50hr', title: 'Yin Yoga 50hr Certification', school: 'Yin Yoga Institute', accred: 'Yoga Alliance', discipline: 'yoga', hours: 50, country: 'NL', countryName: 'Netherlands', location: 'Amsterdam', startDate: '2026-04-25', durationDays: 7, format: 'intensive', online: false, priceFrom: 890, popularity: 78, image: 'https://img.freepik.com/free-photo/yin-yoga_1417-1471.jpg' },
    { slug: 'reiki-master-tt', title: 'Reiki Master Teacher Training', school: 'International House of Reiki', accred: 'IHReiki', discipline: 'healing', hours: 60, country: 'ES', countryName: 'Spain', location: 'Mallorca', startDate: '2026-06-04', durationDays: 8, format: 'intensive', online: false, priceFrom: 1340, popularity: 62, image: 'https://img.freepik.com/free-photo/reiki-healing_1417-1502.jpg' },
    { slug: 'shamanic-tt-peru', title: 'Foundations of Shamanic Practice (sensitive)', school: 'Q’ero Lineage School', accred: '—', discipline: 'ceremony', hours: 100, country: 'PE', countryName: 'Peru', location: 'Sacred Valley', startDate: '2026-10-03', durationDays: 14, format: 'intensive', online: false, priceFrom: 2480, popularity: 60, image: 'https://img.freepik.com/free-photo/sacred-valley-peru_1417-1497.jpg' }
  ];

  /* ── Filter dimensions sourced from canonical Taxonomy ─── */
  const T = window.Taxonomy;

  const DISCIPLINES = [{ slug: '', label: 'Any discipline' }].concat(
    T.TRAINING_TAXONOMY.map(p => ({ slug: p.slug, label: p.name, sensitive: !!p.sensitive }))
  );

  const HOURS   = T.TRAINING_HOURS.slice();
  const STARTS  = T.TRAINING_STARTS.slice();
  const FORMATS = T.TRAINING_FORMATS.slice();

  const PLACES = [{ slug: '', label: 'Anywhere' }].concat(
    T.TRAINING_PLACES.filter(p => p.slug).map(p => ({ slug: p.slug, label: p.label }))
  );
  const PLACE_MATCH = T.TRAINING_PLACES.reduce((m, p) => {
    if (!p.slug) return m;
    if (p.online) m[p.slug] = r => r.online;
    else if (p.country) m[p.slug] = r => r.country === p.country;
    return m;
  }, {});

  const POPULAR_HOURS = ['200', '300', '500', '100', '50'];

  // Popular training sub-slugs — featured shortcuts when no pillar is
  // selected. Pads with top-by-count if shorter than the chip cap.
  const POPULAR_TRAINING_SUBS = [
    '200-hour-ytt', '300-hour-ytt', 'somatic-experiencing', 'meditation-tt',
    'life-coach', 'breathwork-facilitator', 'sound-healing-cert', 'doula',
    'reiki', 'mindfulness-tt'
  ];

  /* Sub-discipline filter — narrows results within a pillar. Prototype
     mock data has no sub-slug field, so we match against the sub's
     readable name (e.g. "Vinyasa YTT" → look for "Vinyasa"; "200 Hour
     YTT" → require t.hours == 200). */
  function trainingSubMatch(t) {
    if (!state.sub || !state.discipline) return true;
    const pillar = T.findPillar(T.TRAINING_TAXONOMY, state.discipline);
    const sub = pillar?.subs.find(s => s.slug === state.sub);
    if (!sub) return true;
    const hourMatch = sub.name.match(/(\d{2,3})\s*hour/i);
    if (hourMatch) return Number(t.hours) === Number(hourMatch[1]);
    const tokens = sub.name
      .replace(/(YTT|TT|Training|Teacher|Certification|Cert\.?|Course|\(.*?\))/gi, '')
      .toLowerCase()
      .split(/[^a-z0-9]+/)
      .filter(w => w.length >= 4);
    if (!tokens.length) return true;
    const hay = ((t.title || '') + ' ' + (t.school || '')).toLowerCase();
    return tokens.some(tok => hay.includes(tok));
  }

  /* ── State ─────────────────────────────────────────────── */
  const state = {
    q: '', discipline: '', sub: '', hours: '', where: '', starts: '', format: '',
    sort: 'DATE_ASC',
    selectedSlug: null,
    items: []
  };

  /* ── URL <-> state ─────────────────────────────────────── */
  function readUrl() {
    const p = new URLSearchParams(location.search);
    state.q          = p.get('q') || '';
    state.discipline = p.get('discipline') || '';
    state.sub        = p.get('sub') || '';
    state.hours      = p.get('hours') || '';
    state.where      = p.get('where') || '';
    state.starts     = p.get('starts') || '';
    state.format     = p.get('format') || '';
    state.sort       = p.get('sort') || 'DATE_ASC';
  }
  function writeUrl(replace = true) {
    const p = new URLSearchParams();
    if (state.q)          p.set('q', state.q);
    if (state.discipline) p.set('discipline', state.discipline);
    if (state.sub)        p.set('sub', state.sub);
    if (state.hours)      p.set('hours', state.hours);
    if (state.where)      p.set('where', state.where);
    if (state.starts)     p.set('starts', state.starts);
    if (state.format)     p.set('format', state.format);
    if (state.sort && state.sort !== 'DATE_ASC') p.set('sort', state.sort);
    const url = location.pathname + (p.toString() ? `?${p.toString()}` : '');
    history[replace ? 'replaceState' : 'pushState'](null, '', url);
  }

  /* ── Helpers ──────────────────────────────────────────── */
  function htmlEscape(s) {
    return String(s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function fmtPrice(p) { return `€${p.toLocaleString('en-US')}`; }
  function fmtCert(hours) {
    if (hours >= 500) return `${hours}HR`;
    return `${hours}HR`;
  }
  function fmtDuration(days) {
    if (days >= 320) return '12 mo';
    if (days >= 180) return `${Math.round(days / 30)} mo`;
    if (days >= 60)  return `${Math.round(days / 30)} mo`;
    if (days >= 28)  return `${Math.round(days / 7)} weeks`;
    return `${days} days`;
  }
  function fmtFormat(f) {
    return f === 'intensive' ? 'Intensive' : f === 'modular' ? 'Modular' : f === 'online' ? 'Online' : '—';
  }
  function fmtStart(iso) {
    return new Date(iso).toLocaleString('en-GB', { month: 'short', year: 'numeric' });
  }
  function findLabel(arr, slug) {
    return (arr.find(x => x.slug === slug) || {}).label || '';
  }

  /* ── Filter + sort ────────────────────────────────────── */
  function applyFilters() {
    let list = TRAININGS.slice();

    if (state.q) {
      const q = state.q.toLowerCase();
      list = list.filter(t =>
        t.title.toLowerCase().includes(q) ||
        t.school.toLowerCase().includes(q) ||
        t.location.toLowerCase().includes(q)
      );
    }
    if (state.discipline) list = list.filter(t => t.discipline === state.discipline);
    if (state.sub) list = list.filter(trainingSubMatch);
    if (state.hours) {
      const H = HOURS.find(x => x.slug === state.hours);
      if (H) list = list.filter(t => t.hours >= H.min && t.hours <= H.max);
    }
    if (state.where && PLACE_MATCH[state.where]) {
      list = list.filter(PLACE_MATCH[state.where]);
    }
    if (state.starts) {
      const S = STARTS.find(x => x.slug === state.starts);
      if (S) {
        const now = new Date();
        list = list.filter(t => {
          const start = new Date(t.startDate);
          if (S.monthsAhead != null) {
            const cutoff = new Date(now); cutoff.setMonth(cutoff.getMonth() + S.monthsAhead);
            return start >= now && start <= cutoff;
          }
          if (S.range) {
            return start >= new Date(S.range[0]) && start < new Date(S.range[1]);
          }
          return true;
        });
      }
    }
    if (state.format) list = list.filter(t => t.format === state.format);

    list.sort((a, b) => {
      switch (state.sort) {
        case 'HOURS_DESC':  return b.hours - a.hours;
        case 'HOURS_ASC':   return a.hours - b.hours;
        case 'PRICE_ASC':   return a.priceFrom - b.priceFrom;
        case 'POPULAR':     return b.popularity - a.popularity;
        case 'DATE_ASC':
        default:            return new Date(a.startDate) - new Date(b.startDate);
      }
    });
    state.items = list;
  }

  /* ── Render: title row ────────────────────────────────── */
  function renderTitle() {
    const title = document.getElementById('ev-page-title');
    const eyebrow = document.getElementById('ev-eyebrow');
    const sub = document.getElementById('ev-page-sub');
    const disc = findLabel(DISCIPLINES, state.discipline);
    const hours = findLabel(HOURS, state.hours);
    let t = 'Trainings', e = 'Browse', s = 'Teacher trainings, certifications, and deep professional immersions. Pick a discipline first, certification hours next.';
    if (state.q) { t = `"${state.q}" trainings`; e = 'Search'; }
    else if (state.discipline && state.hours) { t = `${hours} ${disc} trainings`; e = 'Filtered'; }
    else if (state.discipline) { t = `${disc} trainings`; e = 'Discipline'; }
    else if (state.hours) { t = `${hours} trainings`; e = 'Certification'; }
    if (state.where) s = `Filtered by ${findLabel(PLACES, state.where)}`;
    title.textContent = t;
    eyebrow.textContent = e;
    sub.textContent = s;
    document.title = `${t} — Lumaya`;
  }

  /* ── Render: filterbar ───────────────────────────────── */
  function setPill(id, text, isActive) {
    const el = document.getElementById(id);
    el.querySelector('.label').textContent = text;
    el.classList.toggle('is-active', isActive);
    const clear = el.querySelector('.pill-clear');
    if (clear) clear.hidden = !isActive;
  }
  function renderFilterBar() {
    const wrap = document.getElementById('searchWrap');
    document.getElementById('searchInput').value = state.q;
    wrap.classList.toggle('has-text', !!state.q);
    setPill('disciplinePill', disciplinePillLabel(), !!(state.discipline || state.sub));
    setPill('hoursPill', findLabel(HOURS, state.hours) || 'Any hours', !!state.hours);
    setPill('wherePill', findLabel(PLACES, state.where) || 'Anywhere', !!state.where);
    setPill('startsPill', findLabel(STARTS, state.starts) || 'Any time', !!state.starts);
    setPill('formatPill', findLabel(FORMATS, state.format) || 'Any format', !!state.format);
    document.getElementById('sortSelect').value = state.sort;
  }

  /* ── Discipline pill label (delegated to CategoryModel) ─ */
  function disciplinePillLabel() {
    return window.CategoryModel.formatLabel(
      T.TRAINING_TAXONOMY,
      { pillar: state.discipline, sub: state.sub },
      'Any discipline'
    );
  }

  /* ── Render: chip row — delegated to shared CategoryChips module.
     Cert-hour buckets remain available via the "Any hours" filterbar pill. */
  function renderChips() {
    CategoryChips.render(document.getElementById('chipRow'));
  }

  /* ── Render: result list ─────────────────────────────── */
  /* events-style row-card — same anatomy across pillars */
  function rowCard(t) {
    const dur = fmtDuration(t.durationDays);
    const fmt = fmtFormat(t.format);
    const addr = `${t.location} · ${fmt} · ${dur}`;
    const isSelected = state.selectedSlug === t.slug;
    return `
      <article class="row-card${isSelected ? ' is-selected' : ''}" data-slug="${htmlEscape(t.slug)}">
        <div class="rc-img">
          <img src="${htmlEscape(t.image)}" alt="${htmlEscape(t.title)}" loading="lazy"
               onerror="this.style.display='none'">
          <span class="rc-badge">${htmlEscape(t.hours)}HR</span>
        </div>
        <div class="rc-content">
          <div class="rc-title">${htmlEscape(t.title)}</div>
          <div class="rc-address">${htmlEscape(addr)}</div>
          <div class="rc-price">From ${htmlEscape(fmtPrice(t.priceFrom))}</div>
        </div>
      </article>
    `;
  }
  function renderList() {
    const list = document.getElementById('resultsList');
    const count = document.getElementById('resultCount');
    const items = state.items;
    count.innerHTML = items.length
      ? `<strong>${items.length}</strong> ${items.length === 1 ? 'training' : 'trainings'}`
      : `<span class="muted">No trainings match your filters</span>`;
    if (!items.length) {
      list.innerHTML = `
        <div class="state-block">
          <span class="material-symbols-outlined">school</span>
          <h3>No trainings match</h3>
          <p>Try a different discipline, change cert hours, or expand the start window.</p>
          <button class="reset-btn" type="button" id="resetBtn">
            <span class="material-symbols-outlined">restart_alt</span> Reset filters
          </button>
        </div>`;
      return;
    }
    list.innerHTML = items.map(rowCard).join('');
  }

  /* ── Mock description ──────────────────────────────────── */
  const MOCK_PARAGRAPHS = [
    'A structured certification programme designed for committed practitioners ready to step into teaching. Lineage-rooted, methodically delivered, and held to the standards required for graduation and ongoing professional credibility.',
    'Whether you arrive with years of practice or a clear vocational call, the cohort is shaped to meet you where you are. Expect daily anatomy, philosophy, methodology, ethics, and supervised teaching practicum — the full credential, not a shortcut.',
    'You will leave with the certification, the documented hours, and — more importantly — the embodied confidence to hold space for others. Course materials, mentor support, and post-graduation listing on Lumaya are included.'
  ];
  function generateTrainingDescription(t) {
    const opener = `A ${t.hours}hr ${t.discipline} certification programme held in ${t.location} by ${t.school}.`;
    return `${opener}\n\n${MOCK_PARAGRAPHS.join('\n\n')}`;
  }

  /* ── Render: detail pane (auto-opens on card click) ── */
  function renderDetail() {
    const pane = document.getElementById('detailPane');
    const split = document.getElementById('split');
    if (!state.selectedSlug) {
      split.classList.remove('detail-open');
      pane.setAttribute('aria-hidden', 'true');
      pane.innerHTML = '';
      return;
    }
    const t = state.items.find(x => x.slug === state.selectedSlug)
           || TRAININGS.find(x => x.slug === state.selectedSlug);
    if (!t) {
      split.classList.remove('detail-open');
      pane.setAttribute('aria-hidden', 'true');
      pane.innerHTML = '';
      return;
    }
    const dur = fmtDuration(t.durationDays);
    const fmt = fmtFormat(t.format);
    const description = generateTrainingDescription(t);
    pane.innerHTML = `
      <div class="dp-img">
        <div class="dp-grabber"></div>
        <img src="${htmlEscape(t.image)}" alt="${htmlEscape(t.title)}"
             onerror="this.style.display='none'">
        <div class="dp-img-overlay"></div>
        <span class="dp-badge">${htmlEscape(t.hours)}HR</span>
        <button class="dp-close" id="dpClose" type="button" aria-label="Close details">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <div class="dp-body">
        <div class="dp-title">${htmlEscape(t.title)}</div>
        <div class="dp-meta">
          <span class="meta-item"><span class="material-symbols-outlined">${t.online ? 'videocam' : 'place'}</span>${htmlEscape(t.location)}</span>
          <span class="meta-item"><span class="material-symbols-outlined">tune</span>${htmlEscape(fmt)}</span>
          <span class="meta-item"><span class="material-symbols-outlined">schedule</span>${htmlEscape(dur)}</span>
        </div>
        <div class="dp-section">
          <div class="dp-stats">
            <div class="dp-stat"><div class="label">Cert hours</div><div class="value">${htmlEscape(t.hours)}HR</div></div>
            <div class="dp-stat"><div class="label">Format</div><div class="value">${htmlEscape(fmt)}</div></div>
            <div class="dp-stat"><div class="label">School</div><div class="value">${htmlEscape(t.school)}</div></div>
            <div class="dp-stat"><div class="label">Accreditation</div><div class="value">${htmlEscape(t.accred && t.accred !== '—' ? t.accred : '—')}</div></div>
            <div class="dp-stat"><div class="label">Begins</div><div class="value">${t.startDate ? new Date(t.startDate).toLocaleString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '—'}</div></div>
            <div class="dp-stat"><div class="label">Country</div><div class="value">${htmlEscape(t.countryName)}</div></div>
          </div>
        </div>
        <div class="dp-section">
          <div class="dp-section-label">About this training</div>
          <p class="dp-description">${htmlEscape(description)}</p>
        </div>
      </div>
      <div class="dp-foot">
        <div class="price">From ${htmlEscape(fmtPrice(t.priceFrom))}</div>
        <a class="view-btn" href="#" data-slug="${htmlEscape(t.slug)}">
          View training <span class="material-symbols-outlined">arrow_forward</span>
        </a>
      </div>
    `;
    split.classList.add('detail-open');
    pane.setAttribute('aria-hidden', 'false');
  }

  function openDetail(slug) {
    state.selectedSlug = slug;
    renderList();    // re-mark selected card
    renderDetail();
  }
  function closeDetail() {
    state.selectedSlug = null;
    renderList();
    renderDetail();
  }

  /* ── Sheet (mobile bottom sheet) ──────────────────── */
  function openSheet() {
    document.getElementById('detailPane').classList.add('sheet-open');
    document.getElementById('sheetBackdrop').classList.add('is-open');
    document.body.style.overflow = 'hidden';
  }
  function closeSheet() {
    document.getElementById('detailPane').classList.remove('sheet-open');
    document.getElementById('sheetBackdrop').classList.remove('is-open');
    document.body.style.overflow = '';
  }

  /* ── Render entry-point ──────────────────────────── */
  function render() {
    applyFilters();
    renderTitle();
    renderFilterBar();
    renderChips();
    renderList();
    renderDetail();
  }

  /* ── Wiring ─────────────────────────────────────── */
  let searchDebounce;
  document.getElementById('searchInput').addEventListener('input', e => {
    clearTimeout(searchDebounce);
    const v = e.target.value;
    searchDebounce = setTimeout(() => {
      state.q = v.trim();
      writeUrl(); render();
    }, 220);
  });
  document.getElementById('searchClear').addEventListener('click', () => {
    state.q = ''; document.getElementById('searchInput').value = '';
    writeUrl(); render();
  });

  /* Each pill: click on body opens PillPicker; click on the X clears. */
  function wirePill(pillId, items, stateKey) {
    document.getElementById(pillId).addEventListener('click', e => {
      if (e.target.closest(`[data-clear="${stateKey}"]`)) {
        state[stateKey] = '';
        writeUrl(); render();
        return;
      }
      const opts = items.map(it => ({ value: it.slug, label: it.label }));
      PillPicker.open(e.currentTarget, opts, state[stateKey], (val) => {
        state[stateKey] = val;
        writeUrl(); render();
      });
    });
  }
  /* Discipline pill: tree picker (CategoryModel + PillPicker). */
  CategoryModel.wireCategoryPill({
    pillEl: document.getElementById('disciplinePill'),
    taxonomy: T.TRAINING_TAXONOMY,
    anyLabel: 'Any discipline',
    getValue: () => ({ pillar: state.discipline, sub: state.sub }),
    onChange: ({ pillar, sub }) => {
      state.discipline = pillar; state.sub = sub;
      writeUrl(); render();
    }
  });
  wirePill('hoursPill',      HOURS,       'hours');
  wirePill('wherePill',      PLACES,      'where');
  wirePill('startsPill',     STARTS,      'starts');
  wirePill('formatPill',     FORMATS,     'format');

  document.getElementById('sortSelect').addEventListener('change', e => {
    state.sort = e.target.value; writeUrl(); render();
  });

  // Chip row — pillar+sub shortcut. Hours filtering stays accessible via
  // the "Any hours" filterbar pill.
  CategoryChips.mount({
    rowEl: document.getElementById('chipRow'),
    taxonomy: T.TRAINING_TAXONOMY,
    anyLabel: 'disciplines',
    popular: POPULAR_TRAINING_SUBS,
    getValue: () => ({ pillar: state.discipline, sub: state.sub }),
    onChange: ({ pillar, sub }) => {
      state.discipline = pillar; state.sub = sub;
      writeUrl(); render();
    }
  });

  /* Card click → open detail. Reset button → clear filters. */
  document.getElementById('resultsList').addEventListener('click', e => {
    if (e.target.closest('#resetBtn')) {
      state.q = state.discipline = state.sub = state.hours = state.where = state.starts = state.format = '';
      closeDetail();
      writeUrl(); render();
      return;
    }
    const card = e.target.closest('.row-card[data-slug]');
    if (card) {
      openDetail(card.dataset.slug);
      if (window.matchMedia('(max-width: 1080px)').matches) openSheet();
    }
  });

  /* X close in detail pane */
  document.getElementById('detailPane').addEventListener('click', e => {
    if (e.target.closest('#dpClose')) {
      if (window.matchMedia('(max-width: 1080px)').matches) {
        closeSheet();
        setTimeout(() => closeDetail(), 320);
      } else {
        closeDetail();
      }
    }
  });

  /* Backdrop tap — close sheet */
  document.getElementById('sheetBackdrop').addEventListener('click', () => {
    closeSheet();
    setTimeout(() => closeDetail(), 320);
  });

  /* Esc closes detail */
  document.addEventListener('keydown', e => {
    if (e.key === 'Escape' && state.selectedSlug) {
      if (window.matchMedia('(max-width: 1080px)').matches) {
        closeSheet();
        setTimeout(() => closeDetail(), 320);
      } else {
        closeDetail();
      }
    }
  });

  window.addEventListener('popstate', () => { readUrl(); render(); });

  /* ── Bootstrap ────────────────────────────────── */
  function init() {
    readUrl();
    render();
  }
  // Wait for /categories.json to load before first render — chip rows
  // and pillar lists iterate T.TRAINING_TAXONOMY at boot.
  T.ready.then(init);
</script>

<script src="auth-overlay.js"></script>
</body>
</html>
