<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Host — Lumaya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,400;0,500;0,600;1,400&family=Noto+Serif:ital,wght@0,400;0,500;0,700;1,400&family=Manrope:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
<style>
.material-symbols-outlined { font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24; }

:root {
  --bg: #FCF9F4;
  --bg-2: #F6F3EE;
  --bg-3: #EBE8E3;
  --surface: #FFFFFF;
  --text: #1C1C19;
  --text-muted: #5C5C5C;
  --text-subtle: #8A8A8A;
  --border: #C2C8C3;
  --primary: #182c24;
  --surface-low: #F6F3EE;
  --surface-container: #F0EDE8;
  --outline-variant: rgba(194, 200, 195, 0.35);
  --olive-100: #E4E6DB;
  --olive-500: #41452F;
  --olive-900: #1C1D13;
  --orange-300: #E4BB86;
  --orange-500: #D69543;
  --orange-600: #C4812B;
  --radius-sm: 8px;
  --radius-md: 14px;
  --radius-lg: 20px;
  --radius-pill: 999px;
  --shadow-sm: 0 1px 2px rgba(29,29,33,0.04), 0 2px 6px rgba(29,29,33,0.04);
  --shadow-md: 0 4px 14px rgba(29,29,33,0.06), 0 10px 30px rgba(29,29,33,0.05);
  --shadow-lg: 0 20px 60px rgba(29,29,33,0.10);
  --ease: cubic-bezier(.2,.7,.2,1);
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: 'Inter', system-ui, -apple-system, sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; line-height: 1.55;
}
h1, h2, h3, h4 {
  font-family: 'Lora', Georgia, serif;
  font-weight: 500; letter-spacing: -0.012em; margin: 0;
}
a { color: inherit; text-decoration: none; }
button { font: inherit; cursor: pointer; border: none; background: none; color: inherit; }
img { display: block; }

.container { width: 100%; max-width: 1240px; margin: 0 auto; padding: 0 32px; }
@media (max-width: 640px) { .container { padding: 0 18px; } }

/* Header / footer / bottom-nav: see header.js, footer.js, bottom-nav.js */

/* ── Page wrap ─────────────────────────────── */
.page { padding: 0 0 96px; }

/* ── Breadcrumb ────────────────────────────── */
.breadcrumb {
  display: flex; align-items: center; gap: 6px;
  font-size: 13px; color: var(--text-muted);
  padding: 18px 0 4px;
}
.breadcrumb a { transition: color 0.15s; }
.breadcrumb a:hover { color: var(--orange-600); }
.breadcrumb .sep { color: var(--text-subtle); font-size: 11px; }
.breadcrumb .current { color: var(--text); font-weight: 500;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 60vw; }

/* ── Banner with avatar overlay ─────────────── */
.banner-section {
  position: relative; width: 100%;
  height: 320px;
  background: var(--bg-3);
  overflow: hidden;
  margin-top: 12px;
}
.banner-image {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transition: opacity 0.5s var(--ease);
}
.banner-image.loaded { opacity: 1; }
.banner-section.skel::before {
  content: ''; position: absolute; inset: 0;
  background: linear-gradient(90deg, #EBE8E3 25%, #F0EDE8 50%, #EBE8E3 75%);
  background-size: 200% 100%; animation: shimmer 1.6s infinite;
}
.banner-section::after {
  content: ''; position: absolute; left: 0; right: 0; bottom: 0; height: 50%;
  background: linear-gradient(to bottom, rgba(28,28,25,0) 0%, rgba(28,28,25,0.18) 100%);
  pointer-events: none;
}

.profile-shell {
  position: relative;
  margin-top: -88px;
  z-index: 2;
  padding-bottom: 28px;
}
.profile-row {
  display: flex; align-items: flex-end; gap: 28px;
  flex-wrap: wrap;
}
.profile-avatar {
  width: 180px; height: 252px;
  border-radius: var(--radius-md);
  overflow: hidden;
  border: 4px solid var(--bg);
  box-shadow: var(--shadow-md);
  background: var(--bg-3);
  flex-shrink: 0;
}
.profile-avatar img { width: 100%; height: 100%; object-fit: cover; opacity: 0; transition: opacity 0.4s var(--ease); }
.profile-avatar img.loaded { opacity: 1; }
.profile-avatar.skel { animation: shimmer 1.6s infinite; background: linear-gradient(90deg,#EBE8E3 25%,#F0EDE8 50%,#EBE8E3 75%); background-size: 200% 100%; }
.profile-info { flex: 1; min-width: 240px; padding-bottom: 12px; }
.profile-eyebrow {
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: 0.16em; text-transform: uppercase;
  color: var(--orange-600); margin-bottom: 12px;
  display: inline-flex; align-items: center; gap: 8px;
}
.profile-eyebrow::before {
  content: ''; width: 24px; height: 1px;
  background: var(--orange-300);
}
h1.profile-title {
  font-size: clamp(28px, 4.2vw, 42px);
  line-height: 1.1; font-weight: 500;
  color: var(--text); margin-bottom: 8px;
}
.profile-meta {
  display: flex; flex-wrap: wrap; align-items: center;
  gap: 6px 14px; font-size: 14px; color: var(--text-muted);
}
.profile-meta .meta-item {
  display: inline-flex; align-items: center; gap: 6px;
  transition: color 0.15s;
}
.profile-meta a.meta-item:hover { color: var(--orange-600); }
.profile-meta .material-symbols-outlined { font-size: 16px; color: var(--text-subtle); }

/* Contact icons */
.contact-icons {
  display: flex; gap: 8px; align-items: center;
  margin-left: auto; padding-bottom: 12px;
  flex-wrap: wrap;
}
.contact-btn {
  width: 44px; height: 44px; border-radius: 50%;
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  display: inline-flex; align-items: center; justify-content: center;
  color: var(--text); transition: transform 0.15s var(--ease), box-shadow 0.15s, border-color 0.15s;
}
.contact-btn:hover {
  transform: translateY(-2px);
  border-color: var(--orange-300);
  box-shadow: var(--shadow-sm);
}
.contact-btn .material-symbols-outlined { font-size: 20px; }
.contact-btn svg { width: 18px; height: 18px; }

/* ── Tabs ──────────────────────────────────── */
.tabs-bar {
  border-top: 1px solid var(--outline-variant);
  border-bottom: 1px solid var(--outline-variant);
  margin-top: 16px;
  background: var(--bg);
  position: sticky; top: 71px; z-index: 20;
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  background: rgba(252, 249, 244, 0.94);
}
.tabs {
  display: flex; gap: 4px; align-items: center;
}
.tab {
  position: relative;
  padding: 16px 4px;
  margin-right: 24px;
  font: 500 14px/1 'Inter', sans-serif;
  color: var(--text-muted);
  letter-spacing: 0.01em;
  transition: color 0.15s;
}
.tab .count {
  display: inline-block;
  font-size: 11px; font-weight: 600;
  color: var(--text-subtle);
  margin-left: 6px;
  vertical-align: 1px;
}
.tab:hover { color: var(--text); }
.tab.active { color: var(--text); }
.tab.active::after {
  content: '';
  position: absolute; left: 0; right: 0; bottom: -1px;
  height: 2px; background: var(--orange-500);
  border-radius: 2px 2px 0 0;
}

/* ── Tab content ───────────────────────────── */
.tab-content { padding: 48px 0 0; display: none; }
.tab-content.active { display: block; }

.section-title {
  font-size: 22px; line-height: 1.25;
  margin-bottom: 18px; color: var(--text);
}

/* About */
.about-grid {
  display: grid;
  grid-template-columns: minmax(0, 1fr) 320px;
  gap: 64px;
  align-items: start;
}
@media (max-width: 900px) {
  .about-grid { grid-template-columns: 1fr; gap: 36px; }
}
.about-slogan {
  font-family: 'Lora', Georgia, serif;
  font-size: 19px; font-style: italic; line-height: 1.55;
  color: var(--text); margin-bottom: 28px;
  padding-left: 16px;
  border-left: 2px solid var(--orange-300);
}
.about-body {
  font-size: 16px; line-height: 1.75; color: var(--text-muted);
  max-width: 720px;
}
.about-body h2, .about-body h3 {
  font-family: 'Lora', Georgia, serif;
  font-size: 19px; font-weight: 500; color: var(--text);
  margin: 28px 0 10px; line-height: 1.35;
  letter-spacing: -0.005em;
}
.about-body h2:first-child, .about-body h3:first-child { margin-top: 0; }
.about-body p { margin: 0 0 16px; }
.about-body p:last-child { margin-bottom: 0; }
.about-body strong { color: var(--text); font-weight: 600; }
.about-body ul { padding-left: 20px; margin: 0 0 16px; }
.about-body li { margin-bottom: 6px; }
.about-body a { color: var(--orange-600); text-decoration: underline; text-underline-offset: 3px; }
.about-body a:hover { color: var(--orange-500); }

/* Side card on About */
.side-card {
  background: var(--surface);
  border: 1px solid var(--outline-variant);
  border-radius: var(--radius-lg);
  padding: 22px 22px 18px;
  box-shadow: var(--shadow-sm);
}
.side-title {
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: 0.12em; text-transform: uppercase;
  color: var(--text-subtle); margin-bottom: 16px;
}
.side-row {
  display: flex; align-items: flex-start; gap: 12px;
  padding: 12px 0; font-size: 14px;
  border-top: 1px solid var(--outline-variant);
}
.side-row:first-of-type { border-top: none; }
.side-row .material-symbols-outlined {
  font-size: 18px; color: var(--text-subtle); flex-shrink: 0; margin-top: 1px;
}
.side-row .label { color: var(--text-muted); font-size: 12px; margin-bottom: 2px; }
.side-row .value {
  font-size: 14px; color: var(--text); font-weight: 500;
  word-break: break-word;
}
.side-row a.value:hover { color: var(--orange-600); }

/* Events grid */
.events-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
  gap: 24px 18px;
}
.events-section + .events-section { margin-top: 56px; }
.events-section-title {
  font-family: 'Lora', Georgia, serif;
  font-size: 19px; font-weight: 500; color: var(--text);
  margin-bottom: 18px;
}
.event-card {
  display: block; cursor: pointer;
  color: inherit; text-decoration: none;
}
.event-img {
  width: 100%; aspect-ratio: 4 / 5;
  border-radius: var(--radius-lg);
  overflow: hidden; background: var(--bg-3);
  position: relative; margin-bottom: 12px;
}
.event-img img {
  width: 100%; height: 100%; object-fit: cover;
  opacity: 0; transition: opacity 0.4s var(--ease), transform 0.5s var(--ease);
}
.event-img img.loaded { opacity: 1; }
.event-card:hover .event-img img.loaded { transform: scale(1.04); }
.event-badge {
  position: absolute; top: 10px; left: 10px;
  background: rgba(252, 249, 244, 0.88);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 4px 10px; border-radius: var(--radius-pill);
  font: 600 10px/1.4 'Inter', sans-serif;
  letter-spacing: 0.06em; color: var(--primary);
  text-transform: capitalize;
}
.event-date {
  position: absolute; bottom: 10px; left: 10px;
  background: rgba(252, 249, 244, 0.92);
  backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
  padding: 4px 10px; border-radius: var(--radius-pill);
  font: 600 11px/1.4 'Inter', sans-serif;
  color: var(--text);
}
.event-title {
  font: 600 13px/1.35 'Inter', sans-serif;
  color: var(--text); margin-bottom: 4px;
  display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  overflow: hidden;
}
.event-meta {
  font-size: 12px; color: var(--text-muted); margin-bottom: 3px;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.event-price { font-size: 12px; color: var(--text); }
.event-price strong { font-weight: 700; }
.event-card.previous .event-img img { filter: grayscale(0.18) brightness(0.96); }
.event-card.previous .event-img::after {
  content: 'Past'; position: absolute; top: 10px; right: 10px;
  background: rgba(28,28,25,0.74); color: #FCF9F4;
  padding: 3px 9px; border-radius: var(--radius-pill);
  font: 600 10px/1.4 'Inter', sans-serif;
  letter-spacing: 0.06em;
}

/* Skeleton */
.skeleton {
  background: linear-gradient(90deg, #EBE8E3 25%, #F0EDE8 50%, #EBE8E3 75%);
  background-size: 200% 100%;
  animation: shimmer 1.6s infinite;
  border-radius: var(--radius-sm);
}
@keyframes shimmer { 0% { background-position: 200% 0; } 100% { background-position: -200% 0; } }
.skel-line { height: 13px; border-radius: 4px; margin-bottom: 8px; }
.skel-line.w80 { width: 80%; } .skel-line.w55 { width: 55%; } .skel-line.w40 { width: 40%; }
.skel-card .event-img { background: linear-gradient(90deg, #EBE8E3 25%, #F0EDE8 50%, #EBE8E3 75%); background-size: 200% 100%; animation: shimmer 1.6s infinite; }

.empty-state {
  text-align: center; padding: 56px 20px; color: var(--text-muted);
  font-size: 15px;
}
.empty-state .material-symbols-outlined { font-size: 32px; color: var(--text-subtle); margin-bottom: 12px; display: block; }

/* ── Education timeline ─────────────────────── */
.education-section {
  margin-top: 56px;
  padding-top: 48px;
  border-top: 1px solid var(--outline-variant);
}
.education-title {
  font-size: 22px; line-height: 1.25;
  margin-bottom: 36px; color: var(--text);
}
.timeline {
  position: relative;
  padding-left: 28px;
}
.timeline::before {
  content: '';
  position: absolute; left: 7px; top: 8px; bottom: 0;
  width: 1px; background: var(--border);
}
.timeline-item {
  position: relative;
  margin-bottom: 36px;
}
.timeline-item:last-child { margin-bottom: 0; }
.timeline-dot {
  position: absolute; left: -28px; top: 6px;
  width: 15px; height: 15px;
  border-radius: 50%;
  background: var(--bg);
  border: 2px solid var(--orange-300);
  z-index: 1;
}
.timeline-item.featured .timeline-dot {
  border-color: var(--orange-500);
  background: var(--orange-300);
}
.timeline-year {
  font: 600 11px/1 'Inter', sans-serif;
  letter-spacing: 0.08em;
  color: var(--text-subtle);
  text-transform: uppercase;
  margin-bottom: 6px;
}
.timeline-type-badge {
  display: inline-block;
  font: 600 10px/1 'Inter', sans-serif;
  letter-spacing: 0.08em; text-transform: uppercase;
  padding: 3px 8px; border-radius: var(--radius-pill);
  margin-left: 8px;
  vertical-align: 1px;
}
.timeline-type-badge.CERTIFICATION { background: #E8F0EB; color: #2D5A3A; }
.timeline-type-badge.TRAINING       { background: #EEE8DC; color: #6B4A1A; }
.timeline-type-badge.WORKSHOP       { background: #E9EAF5; color: #3A3870; }
.timeline-type-badge.RETREAT        { background: #F2EBF0; color: #5A2D4C; }
.timeline-item-title {
  font: 600 16px/1.3 'Inter', sans-serif;
  color: var(--text); margin-bottom: 4px;
}
.timeline-institution {
  font-size: 14px; color: var(--text-muted); margin-bottom: 4px;
  display: flex; align-items: center; gap: 5px; flex-wrap: wrap;
}
.timeline-institution .material-symbols-outlined { font-size: 14px; color: var(--text-subtle); }
.timeline-desc {
  font-size: 14px; color: var(--text-muted); line-height: 1.6;
  margin-top: 8px;
}

/* ── Mobile ─────────────────────────────────── */
@media (max-width: 720px) {
  .banner-section { height: 220px; margin-top: 0; }
  .profile-shell { margin-top: -64px; padding-bottom: 22px; }
  .profile-avatar { width: 120px; height: 168px; border-width: 3px; }
  .profile-row { gap: 18px; align-items: flex-start; }
  .profile-info { padding-bottom: 0; min-width: 0; flex-basis: calc(100% - 138px); padding-top: 64px; }
  h1.profile-title { font-size: 24px; }
  .profile-meta { font-size: 13px; gap: 4px 12px; }
  .contact-icons { flex-basis: 100%; margin: 12px 0 0; padding-bottom: 0; }
  .contact-btn { width: 40px; height: 40px; }
  .contact-btn .material-symbols-outlined { font-size: 18px; }
  .tabs-bar { top: 71px; margin-top: 8px; }
  .tab { padding: 14px 4px; margin-right: 18px; font-size: 13px; }
  .tab-content { padding-top: 32px; }
  .section-title { font-size: 19px; }
  .events-grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 18px 12px; }
  .event-title { font-size: 12px; }
}

</style>
</head>
<body>

<!-- ── Header (shared partial — see header.js) ── -->
<div data-component="header" data-mode="search"></div>

<!-- ── Page ── -->
<main class="page">
  <div class="container">
    <nav class="breadcrumb" aria-label="Breadcrumb">
      <a href="index.html">Lumaya</a>
      <span class="sep">›</span>
      <a href="events-hub.html">Hosts</a>
      <span class="sep">›</span>
      <span class="current" id="bc-current">
        <span class="skeleton" style="display:inline-block;width:120px;height:11px;border-radius:4px;"></span>
      </span>
    </nav>
  </div>

  <!-- Banner -->
  <div class="banner-section skel" id="banner-section">
    <img class="banner-image" id="banner-img" alt="" loading="eager">
  </div>

  <div class="container">
    <!-- Profile shell -->
    <div class="profile-shell">
      <div class="profile-row">
        <div class="profile-avatar skel" id="profile-avatar"></div>
        <div class="profile-info">
          <p class="profile-eyebrow">Lumaya host</p>
          <h1 class="profile-title" id="profile-title">
            <span class="skeleton" style="display:inline-block;width:240px;height:34px;border-radius:6px;"></span>
          </h1>
          <div class="profile-meta" id="profile-meta">
            <span class="skeleton" style="display:inline-block;width:200px;height:13px;border-radius:4px;"></span>
          </div>
        </div>
        <div class="contact-icons" id="contact-icons" hidden></div>
      </div>
    </div>

    <!-- Tabs -->
    <div class="tabs-bar">
      <div class="tabs" role="tablist">
        <button class="tab active" role="tab" data-tab="about" aria-selected="true">About</button>
        <button class="tab" role="tab" data-tab="events" aria-selected="false">
          Events <span class="count" id="tab-events-count"></span>
        </button>
      </div>
    </div>

    <!-- About tab -->
    <section class="tab-content active" id="tab-about" role="tabpanel">
      <div class="about-grid">
        <div>
          <h2 class="section-title">About</h2>
          <div class="about-slogan" id="about-slogan" hidden></div>
          <div class="about-body" id="about-body">
            <div class="skeleton skel-line" style="width:96%"></div>
            <div class="skeleton skel-line" style="width:88%"></div>
            <div class="skeleton skel-line" style="width:92%"></div>
            <div class="skeleton skel-line" style="width:70%"></div>
            <div class="skeleton skel-line" style="width:85%; margin-top:16px"></div>
            <div class="skeleton skel-line" style="width:78%"></div>
          </div>
        </div>
        <aside id="side-card-wrap">
          <div class="side-card" id="side-card" hidden>
            <div class="side-title">Get in touch</div>
            <div id="side-rows"></div>
          </div>
        </aside>
      </div>

      <!-- Education timeline (within About tab) -->
      <div class="education-section" id="education-section" hidden>
        <h2 class="education-title section-title">Path &amp; Formation</h2>
        <div class="timeline" id="education-timeline"></div>
      </div>
    </section>

    <!-- Events tab -->
    <section class="tab-content" id="tab-events" role="tabpanel">
      <h2 class="section-title">Experiences</h2>
      <div id="events-loader">
        <div class="events-grid">
          <div class="skel-card event-card"><div class="event-img"></div><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div>
          <div class="skel-card event-card"><div class="event-img"></div><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div>
          <div class="skel-card event-card"><div class="event-img"></div><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div>
          <div class="skel-card event-card"><div class="event-img"></div><div class="skeleton skel-line w80"></div><div class="skeleton skel-line w55"></div><div class="skeleton skel-line w40"></div></div>
        </div>
      </div>
      <div id="events-content" hidden>
        <div class="events-section" id="upcoming-section" hidden>
          <h3 class="events-section-title">Upcoming</h3>
          <div class="events-grid" id="upcoming-grid"></div>
        </div>
        <div class="events-section" id="previous-section" hidden>
          <h3 class="events-section-title">Past experiences</h3>
          <div class="events-grid" id="previous-grid"></div>
        </div>
        <div class="empty-state" id="events-empty" hidden>
          <span class="material-symbols-outlined">event_busy</span>
          No events listed yet — reach out directly for upcoming sessions.
        </div>
      </div>
    </section>
  </div>

<script>
  const API = 'https://api.lumaya.co';
  const DEFAULT_SLUG = 'kuschelraum';

  /* ── Helpers ──────────────────────────────────────────── */
  function getSlug() {
    return new URL(location.href).searchParams.get('slug') || DEFAULT_SLUG;
  }
  function getInitialTab() {
    const t = new URL(location.href).searchParams.get('tab');
    return t === 'events' ? 'events' : 'about';
  }
  function escapeHtml(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function formatPrice(p) {
    if (!p) return '';
    if (p.type === 'FREE') return 'Free';
    if (p.type === 'PAID_RANGE') return `€${p.amountMin}–€${p.amountMax}`;
    if (p.type === 'PAID' || p.amount) return `€${p.amount}`;
    return '';
  }
  function formatCategory(cats) {
    if (!cats || !cats.length) return '';
    return cats[0].replace(/_/g, ' ');
  }
  function formatAddressShort(addr) {
    if (!addr) return '';
    const parts = addr.split(',');
    return parts.length > 1 ? parts.slice(0, 2).join(',').trim() : addr;
  }
  function formatDateShort(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleString('en-GB', { day: 'numeric', month: 'short' });
  }
  function googleMapsLink(loc) {
    if (!loc) return '#';
    if (loc.placesId) return `https://www.google.com/maps/place/?q=place_id:${loc.placesId}`;
    if (loc.address) return `https://maps.google.com/?q=${encodeURIComponent(loc.address)}`;
    return '#';
  }
  function instagramUrl(handle) {
    if (!handle) return '';
    if (/^https?:/i.test(handle)) return handle;
    const clean = handle.replace(/^@/, '');
    return `https://instagram.com/${clean}`;
  }
  function telegramUrl(handle) {
    if (!handle) return '';
    if (/^https?:/i.test(handle)) return handle;
    const clean = handle.replace(/^@/, '');
    return `https://t.me/${clean}`;
  }
  function whatsappUrl(num) {
    if (!num) return '';
    const digits = num.replace(/[^0-9]/g, '');
    return `https://wa.me/${digits}`;
  }

  /* Markdown-lite (paragraphs, **bold**, [text](url), bullets, ## headings) */
  function renderMarkdown(md) {
    if (!md) return '';
    const lines = md.split('\n');
    const out = []; let buf = []; let inList = false;
    const flushPara = () => {
      if (!buf.length) return;
      const text = buf.join(' ').trim();
      if (text) out.push(`<p>${inlineMd(text)}</p>`);
      buf = [];
    };
    const flushList = () => { if (inList) { out.push('</ul>'); inList = false; } };
    for (const raw of lines) {
      const line = raw.trim();
      if (!line) { flushPara(); flushList(); continue; }
      if (/^##\s+/.test(line)) {
        flushPara(); flushList();
        out.push(`<h3>${inlineMd(line.replace(/^##\s+/, ''))}</h3>`);
      } else if (/^[*-]\s+/.test(line)) {
        flushPara();
        if (!inList) { out.push('<ul>'); inList = true; }
        out.push(`<li>${inlineMd(line.replace(/^[*-]\s+/, ''))}</li>`);
      } else {
        flushList();
        buf.push(line);
      }
    }
    flushPara(); flushList();
    return out.join('\n');
  }
  function inlineMd(s) {
    return escapeHtml(s)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/\[([^\]]+)\]\(([^)]+?)(?:\s+&quot;[^)]*&quot;)?\)/g,
        (_, label, url) => `<a href="${url}" target="_blank" rel="noopener noreferrer">${label}</a>`);
  }

  /* ── Banner & avatar render ───────────────────────────── */
  function renderBanner(profile) {
    const banner = document.getElementById('banner-section');
    const img = document.getElementById('banner-img');
    if (profile.backgroundImageUrl) {
      img.alt = `${profile.name} backdrop`;
      img.addEventListener('load', () => {
        img.classList.add('loaded');
        banner.classList.remove('skel');
      }, { once: true });
      img.addEventListener('error', () => banner.classList.remove('skel'), { once: true });
      img.src = profile.backgroundImageUrl;
    } else {
      banner.classList.remove('skel');
      banner.style.background = 'linear-gradient(135deg, #E4E6DB 0%, #F0EDE8 60%, #FCF9F4 100%)';
    }

    const avatar = document.getElementById('profile-avatar');
    avatar.innerHTML = '';
    if (profile.avatarImageUrl) {
      const ai = document.createElement('img');
      ai.alt = profile.name; ai.loading = 'eager'; ai.decoding = 'async';
      ai.addEventListener('load', () => { ai.classList.add('loaded'); avatar.classList.remove('skel'); });
      ai.addEventListener('error', () => avatar.classList.remove('skel'));
      ai.src = profile.avatarImageUrl;
      avatar.appendChild(ai);
    } else {
      avatar.classList.remove('skel');
      avatar.innerHTML = `<div style="width:100%;height:100%;display:grid;place-items:center;color:var(--text-subtle);background:var(--bg-3)"><span class="material-symbols-outlined" style="font-size:36px">person</span></div>`;
    }
  }

  /* ── Profile meta + contact ───────────────────────────── */
  function renderProfileHead(profile) {
    document.getElementById('profile-title').textContent = profile.name || 'Lumaya host';
    document.title = `${profile.name || 'Host'} — Lumaya`;
    document.getElementById('bc-current').textContent = profile.name || 'Host';

    const meta = document.getElementById('profile-meta');
    const addr = profile.location && profile.location.address;
    const bits = [];
    if (addr) {
      bits.push(`<a class="meta-item" href="${googleMapsLink(profile.location)}" target="_blank" rel="noopener noreferrer"><span class="material-symbols-outlined">place</span>${escapeHtml(addr)}</a>`);
    }
    bits.push(`<span class="meta-item"><span class="material-symbols-outlined">verified</span>Verified host on Lumaya</span>`);
    meta.innerHTML = bits.join('');

    /* Contact icons */
    const c = profile.contact || {};
    const wrap = document.getElementById('contact-icons');
    const items = [];
    if (c.whatsapp) items.push({ href: whatsappUrl(c.whatsapp), icon: 'chat', label: 'WhatsApp' });
    if (c.email) items.push({ href: `mailto:${c.email}`, icon: 'mail', label: 'Email' });
    if (c.telegram) items.push({ href: telegramUrl(c.telegram), icon: 'send', label: 'Telegram' });
    if (c.instagramUsername) items.push({ href: instagramUrl(c.instagramUsername), icon: 'photo_camera', label: 'Instagram' });
    if (c.url) items.push({ href: c.url, icon: 'language', label: 'Website' });
    if (items.length) {
      wrap.hidden = false;
      wrap.innerHTML = items.map(i =>
        `<a class="contact-btn" href="${i.href}" target="_blank" rel="noopener noreferrer" aria-label="${i.label}" title="${i.label}"><span class="material-symbols-outlined">${i.icon}</span></a>`
      ).join('');
    }

    /* Side card */
    const sc = document.getElementById('side-card');
    const rows = [];
    if (addr) {
      rows.push(`<a class="side-row" href="${googleMapsLink(profile.location)}" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined">place</span>
        <span><div class="label">Based in</div><span class="value">${escapeHtml(addr)}</span></span>
      </a>`);
    }
    if (c.url) {
      rows.push(`<a class="side-row" href="${c.url}" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined">language</span>
        <span><div class="label">Website</div><span class="value">${escapeHtml(c.url.replace(/^https?:\/\//,'').replace(/\/$/,''))}</span></span>
      </a>`);
    }
    if (c.email) {
      rows.push(`<a class="side-row" href="mailto:${c.email}">
        <span class="material-symbols-outlined">mail</span>
        <span><div class="label">Email</div><span class="value">${escapeHtml(c.email)}</span></span>
      </a>`);
    }
    if (c.instagramUsername) {
      rows.push(`<a class="side-row" href="${instagramUrl(c.instagramUsername)}" target="_blank" rel="noopener noreferrer">
        <span class="material-symbols-outlined">photo_camera</span>
        <span><div class="label">Instagram</div><span class="value">${escapeHtml(c.instagramUsername)}</span></span>
      </a>`);
    }
    if (rows.length) {
      sc.hidden = false;
      document.getElementById('side-rows').innerHTML = rows.join('');
    }
  }

  /* ── About render ─────────────────────────────────────── */
  function renderAbout(profile) {
    const sloganEl = document.getElementById('about-slogan');
    const slogan = (profile.slogan || '').trim();
    if (slogan) {
      sloganEl.hidden = false;
      sloganEl.textContent = slogan.replace(/\n+/g, ' ');
    }
    document.getElementById('about-body').innerHTML = renderMarkdown(profile.description || '')
      || '<p style="color:var(--text-subtle);font-style:italic">This host hasn\'t written an introduction yet.</p>';
  }

  /* ── Event card render ────────────────────────────────── */
  function renderEventCard(ev, isPast) {
    const bd = ev.basicDetails || {};
    const img = (ev.media && ev.media.imageUrls && ev.media.imageUrls[0]) || '';
    const title = bd.title || '';
    const price = formatPrice(bd.price);
    const cat = formatCategory(bd.categories);
    const addr = formatAddressShort((bd.location && bd.location.address) || '');
    const inlineNext = (ev.appointmentConfigurations || [])
      .flatMap(c => c.appointments || [])
      .map(a => a.startDate).filter(Boolean)
      .sort()[0];
    const next = ev.nextAppointment || inlineNext;

    const a = document.createElement('a');
    a.className = 'event-card' + (isPast ? ' previous' : '');
    a.href = `event.html?slug=${ev.slug}`;

    const imgWrap = document.createElement('div');
    imgWrap.className = 'event-img';
    if (img) {
      const i = document.createElement('img');
      i.alt = title; i.loading = 'lazy'; i.decoding = 'async';
      i.addEventListener('load', () => i.classList.add('loaded'));
      i.src = img;
      imgWrap.appendChild(i);
    } else {
      imgWrap.style.display = 'grid';
      imgWrap.style.placeItems = 'center';
      imgWrap.innerHTML = `<span class="material-symbols-outlined" style="color:var(--text-subtle);font-size:32px">image</span>`;
    }
    if (cat) {
      const b = document.createElement('span');
      b.className = 'event-badge'; b.textContent = cat;
      imgWrap.appendChild(b);
    }
    if (next && !isPast) {
      const d = document.createElement('span');
      d.className = 'event-date'; d.textContent = formatDateShort(next);
      imgWrap.appendChild(d);
    }
    a.appendChild(imgWrap);
    a.insertAdjacentHTML('beforeend',
      `<div class="event-title">${escapeHtml(title)}</div>` +
      (addr ? `<div class="event-meta">${escapeHtml(addr)}</div>` : '') +
      (price ? `<div class="event-price"><strong>${price}</strong></div>` : '')
    );
    return a;
  }

  /* ── Events fetch & render ────────────────────────────── */
  async function loadEvents(ownerId) {
    const today = new Date(); today.setHours(0,0,0,0);
    const from = new Date(today); from.setFullYear(from.getFullYear() - 1);
    const to = new Date(today); to.setFullYear(to.getFullYear() + 1); to.setHours(23,59,59,999);
    const params = new URLSearchParams({
      ownerId,
      from: from.toISOString(),
      to: to.toISOString()
    });
    const url = `${API}/api/v3/events/search?${params}`;
    let events = [];
    try {
      const r = await fetch(url);
      if (r.ok) events = await r.json();
    } catch (e) {
      console.error('Events fetch failed', e);
    }
    events = (events || []).filter(e => e && e.state === 'ACTIVE');

    const now = Date.now();
    const enriched = events.map(ev => {
      const inlineDates = (ev.appointmentConfigurations || [])
        .flatMap(c => (c.appointments || []).map(a => a.startDate))
        .filter(Boolean)
        .map(d => new Date(d).getTime());
      const nextTop = ev.nextAppointment ? new Date(ev.nextAppointment).getTime() : null;
      const upcomingInline = inlineDates.filter(t => t > now).sort((a,b) => a - b)[0];
      const next = (nextTop && nextTop > now) ? nextTop : upcomingInline;
      const last = inlineDates.length ? inlineDates.sort((a,b) => b - a)[0] : nextTop;
      return { ev, next, last };
    });

    const upcoming = enriched.filter(x => x.next).sort((a,b) => a.next - b.next).map(x => x.ev);
    const previous = enriched.filter(x => !x.next).sort((a,b) => (b.last||0) - (a.last||0)).map(x => x.ev);

    document.getElementById('tab-events-count').textContent = events.length ? events.length : '';

    const loader = document.getElementById('events-loader');
    const content = document.getElementById('events-content');
    loader.hidden = true;
    content.hidden = false;

    const upcomingGrid = document.getElementById('upcoming-grid');
    const previousGrid = document.getElementById('previous-grid');
    upcomingGrid.innerHTML = '';
    previousGrid.innerHTML = '';
    upcoming.forEach(ev => upcomingGrid.appendChild(renderEventCard(ev, false)));
    previous.forEach(ev => previousGrid.appendChild(renderEventCard(ev, true)));

    document.getElementById('upcoming-section').hidden = !upcoming.length;
    document.getElementById('previous-section').hidden = !previous.length;
    document.getElementById('events-empty').hidden = upcoming.length || previous.length;
  }

  /* ── Education stub ──────────────────────────────────────
     Temporary hardcoded data — will be part of the /profiles/:slug
     API response once the backend exposes host.education[].

  const EDUCATION_TYPE_LABELS = {
    CERTIFICATION: 'Certification',
    TRAINING: 'Training',
    WORKSHOP: 'Workshop',
    RETREAT: 'Retreat'
  };

  /* ── Education render ─────────────────────────────────── */
  function renderEducation(educationItems) {
    if (!educationItems || !educationItems.length) return;
    const section = document.getElementById('education-section');
    const timeline = document.getElementById('education-timeline');
    timeline.innerHTML = '';

    educationItems.forEach(item => {
      const yearLabel = item.yearEnd
        ? `${item.yearStart}–${item.yearEnd}`
        : `${item.yearStart}`;
      const typeBadge = item.type
        ? `<span class="timeline-type-badge ${item.type}">${EDUCATION_TYPE_LABELS[item.type] || item.type}</span>`
        : '';

      const div = document.createElement('div');
      div.className = 'timeline-item' + (item.featured ? ' featured' : '');
      div.innerHTML = `
        <div class="timeline-dot"></div>
        <div class="timeline-year">${escapeHtml(yearLabel)}${typeBadge}</div>
        <div class="timeline-item-title">${escapeHtml(item.title)}</div>
        <div class="timeline-institution">
          <span>${escapeHtml(item.institution)}</span>
          ${item.location ? `<span class="material-symbols-outlined">·</span><span>${escapeHtml(item.location)}</span>` : ''}
        </div>
        ${item.description ? `<div class="timeline-desc">${escapeHtml(item.description)}</div>` : ''}
      `;
      timeline.appendChild(div);
    });

    section.hidden = false;
  }

  /* ── Tabs ─────────────────────────────────────────────── */
  function setActiveTab(tab) {
    document.querySelectorAll('.tab').forEach(b => {
      const active = b.dataset.tab === tab;
      b.classList.toggle('active', active);
      b.setAttribute('aria-selected', active);
    });
    document.querySelectorAll('.tab-content').forEach(c => {
      c.classList.toggle('active', c.id === `tab-${tab}`);
    });
    const u = new URL(location.href);
    if (tab === 'about') u.searchParams.delete('tab'); else u.searchParams.set('tab', tab);
    history.replaceState({}, '', u);
  }
  document.querySelectorAll('.tab').forEach(b => {
    b.addEventListener('click', () => setActiveTab(b.dataset.tab));
  });

  /* Header search is wired in header.js (shared partial) */

  /* ── Bootstrap ────────────────────────────────────────── */
  async function init() {
    const slug = getSlug();
    setActiveTab(getInitialTab());

    let profile = null;
    try {
      const r = await fetch(`${API}/api/v1/profiles/${slug}`);
      if (r.ok) profile = await r.json();
    } catch (e) { console.error('Profile fetch failed', e); }

    if (!profile) {
      document.querySelector('main.page').innerHTML = `
        <div class="container">
          <div style="text-align:center;padding:120px 20px;">
            <h1 style="font-size:32px;margin-bottom:14px;color:var(--text)">Host not found</h1>
            <p style="color:var(--text-muted);margin-bottom:28px">The host you're looking for may have moved or no longer be active on Lumaya.</p>
            <a href="index.html" style="display:inline-flex;align-items:center;gap:6px;background:var(--orange-500);color:#fff;padding:10px 18px;border-radius:var(--radius-pill);font-weight:600;font-size:14px">
              <span class="material-symbols-outlined">arrow_back</span> Back to Lumaya
            </a>
          </div>
        </div>`;
      return;
    }

    renderBanner(profile);
    renderProfileHead(profile);
    renderAbout(profile);
    renderEducation(profile.education || EDUCATION_STUB);
    if (profile.ownerId) loadEvents(profile.ownerId);
    else {
      document.getElementById('events-loader').hidden = true;
      document.getElementById('events-content').hidden = false;
      document.getElementById('events-empty').hidden = false;
    }
  }

  init();
</script>
